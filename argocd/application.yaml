apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/imthe71/devops-hello-api-gitops.git
    targetRevision: main
    path: chart
    helm:
      releaseName: hello-api
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-api
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: hello-api-hello-api
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
