name: Promote UAT image to production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable GHCR image tag validated in UAT
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update production image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("chart/values.yaml")
          content = path.read_text(encoding="utf-8")
          updated = re.sub(
              r'(?m)^(  tag: ")[^"]+("$)',
              rf'\g<1>{os.environ["IMAGE_TAG"]}\g<2>',
              content,
              count=1,
          )
          if updated == content:
              raise SystemExit("image.tag was not updated")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit promotion
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart/values.yaml
          git commit -m "chore: promote image $IMAGE_TAG to production"
          git push
