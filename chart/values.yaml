replicaCount: 2

image:
  repository: ghcr.io/imthe71/devops-hello-api-private
  tag: "644ff56857eebcf97aef16fce9991e13fbb2e93a"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

imagePullSecrets:
  - name: ghcr-pull

# Ciphertext is generated once per cluster/namespace with kubeseal and stored
# in the environment values file. The resulting Secret authenticates kubelet
# image pulls from the private GHCR package.
registryCredentials:
  enabled: true
  name: ghcr-pull
  encryptedDockerConfigJson: ""

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  auth:
    secretName: hello-api-postgres-auth
    encryptedDatabase: ""
    encryptedUsername: ""
    encryptedPassword: ""
  persistence:
    storageClass: standard
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Git only stores the ciphertext. sealed-secrets-controller decrypts it into
# the namespaced Kubernetes Secret consumed by the Deployment at runtime.
secrets:
  runtime:
    enabled: true
    name: hello-api-runtime
    key: APP_DEMO_TOKEN
    encryptedValue: ""

strategy:
  rollingUpdate:
    # With two workers and required pod anti-affinity, release one old Pod
    # before scheduling its replacement on that worker. PDB still guarantees
    # one available Pod throughout the rollout.
    maxUnavailable: 1
    maxSurge: 0

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

podDisruptionBudget:
  minAvailable: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# Production has two schedulable workers, so enforce one matching Pod per
# node whenever capacity permits. UAT overrides this because it has one worker.
topologySpread:
  whenUnsatisfiable: DoNotSchedule

# Strict topology spread keeps the baseline two replicas on separate workers.
# It is not hard anti-affinity because a third HPA replica must be able to use
# one of the two workers, producing a balanced 2+1 placement.
podAntiAffinity:
  required: false

ingress:
  enabled: true
  className: nginx
  host: hello-api.test
