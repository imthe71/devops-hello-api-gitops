replicaCount: 2

image:
  repository: ghcr.io/imthe71/devops-hello-api
  tag: "981f5aabcfa1b8fb283a20a1bdad3351a29a3df0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

imagePullSecrets: []

strategy:
  rollingUpdate:
    # With two workers and required pod anti-affinity, release one old Pod
    # before scheduling its replacement on that worker. PDB still guarantees
    # one available Pod throughout the rollout.
    maxUnavailable: 1
    maxSurge: 0

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

podDisruptionBudget:
  minAvailable: 1

# Production has two schedulable workers, so enforce one matching Pod per
# node whenever capacity permits. UAT overrides this because it has one worker.
topologySpread:
  whenUnsatisfiable: DoNotSchedule

# Required anti-affinity makes the production two-replica layout an invariant:
# matching Pods must occupy different worker hostnames.
podAntiAffinity:
  required: true

ingress:
  enabled: true
  className: nginx
  host: hello-api.test
