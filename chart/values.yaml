replicaCount: 2

image:
  repository: ghcr.io/imthe71/devops-hello-api
  tag: "981f5aabcfa1b8fb283a20a1bdad3351a29a3df0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

imagePullSecrets: []

strategy:
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

podDisruptionBudget:
  minAvailable: 1

ingress:
  enabled: true
  className: nginx
  host: hello-api.test
