# UAT environment overrides.
# The manual Deploy selected revision to UAT workflow updates this immutable tag.
# Production retains chart/values.yaml until a validated change is merged into main.
replicaCount: 2

image:
  tag: "0802882c8c30f5110dea708a7570ee19757a5438"

# UAT has no required anti-affinity, so retain zero-unavailable rolling updates.
strategy:
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# The local UAT cluster has one worker, so two replicas must be allowed to
# co-locate while retaining Pod-level resilience.
topologySpread:
  whenUnsatisfiable: ScheduleAnyway

podAntiAffinity:
  required: false

ingress:
  host: uat.hello-api.test
