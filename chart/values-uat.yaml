# UAT environment overrides.
# The manual Deploy selected revision to UAT workflow updates this immutable tag.
# Production retains chart/values.yaml until a validated change is merged into main.
replicaCount: 2

image:
  tag: "75515d2bc6e85508c45b5fe4121be022f527d163"

# Generated against the UAT controller public certificate. Never copy the
# production value here: strict scope binds ciphertext to its namespace/name.
secrets:
  runtime:
    encryptedValue: ""

# UAT has no required anti-affinity, so retain zero-unavailable rolling updates.
strategy:
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# The local UAT cluster has one worker, so two replicas must be allowed to
# co-locate while retaining Pod-level resilience.
topologySpread:
  whenUnsatisfiable: ScheduleAnyway

podAntiAffinity:
  required: false

ingress:
  host: uat.hello-api.test

# Ciphertext is scoped to the hello-api-uat namespace and decrypts to ghcr-pull.
registryCredentials:
  encryptedDockerConfigJson: ""
